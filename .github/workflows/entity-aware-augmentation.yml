name: Entity-Aware Augmentation Gate

on:
  push:
    branches: ["experiment/entity-aware-augmentation"]
    paths:
      - "backend/app/research/entity_pair.py"
      - "backend/app/research/entity_aware_augmentation.py"
      - "backend/scripts/run_entity_aware_augmentation.py"
      - "backend/tests/test_entity_aware_augmentation.py"
      - ".github/workflows/entity-aware-augmentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: "false"
      EVIDENCEGUARD_ENABLE_LOCAL_MODELS: "true"
      EVIDENCEGUARD_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      EVIDENCEGUARD_NLI_MODEL: "cross-encoder/nli-MiniLM2-L6-H768"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: evidenceguard-hf-entity-aware-v1

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          grep -v '^torch' backend/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt

      - name: Fetch external development and held-out benchmark data
        run: |
          curl --fail --location \
            https://huggingface.co/datasets/yoonsanglee/AmbigDocs/resolve/main/dev.json \
            --output AmbigDocs_dev.json
          curl --fail --location \
            https://raw.githubusercontent.com/HanNight/RAMDocs/main/RAMDocs_test.jsonl \
            --output RAMDocs_test.jsonl
          test -s AmbigDocs_dev.json
          test -s RAMDocs_test.jsonl

      - name: Run unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_qa_aggregate.py tests/test_hypothesis_verifier.py tests/test_entity_aware_augmentation.py

      - name: Train entity classifier externally and run paired 100-case gate
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_entity_aware_augmentation.py \
            --ambigdocs-dev ../AmbigDocs_dev.json \
            --ramdocs ../RAMDocs_test.jsonl \
            --frozen-config ../research/results/frozen/frozen_config.json \
            --ramdocs-limit 100 \
            --output ../research/results/entity_aware_augmentation_gate

      - name: Upload gate results
        uses: actions/upload-artifact@v4
        with:
          name: entity-aware-augmentation-gate-${{ github.sha }}
          path: research/results/entity_aware_augmentation_gate
