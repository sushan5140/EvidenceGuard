name: Model-Backed Research Evaluation
# Publish results only when the evaluated head still matches main.

on:
  push:
    branches: ["main"]
    paths:
      - "backend/app/services/retrieval.py"
      - "backend/app/services/nli.py"
      - "backend/app/services/pipeline.py"
      - "backend/app/services/scoring.py"
      - "backend/app/research/ramdocs.py"
      - "backend/app/research/benchmark.py"
      - "backend/app/research/tuning.py"
      - "backend/scripts/run_model_backed_suite.py"
      - ".github/workflows/model-backed-eval.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model-backed-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKENIZERS_PARALLELISM: "false"
      EVIDENCEGUARD_ENABLE_LOCAL_MODELS: "true"
      EVIDENCEGUARD_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
      EVIDENCEGUARD_NLI_MODEL: "cross-encoder/nli-MiniLM2-L6-H768"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: evidenceguard-hf-minilm-v1

      - name: Install model-backed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          grep -v '^torch' backend/requirements.txt > /tmp/requirements-no-torch.txt
          pip install -r /tmp/requirements-no-torch.txt
          pip install "matplotlib>=3.9,<4"

      - name: Fetch official RAMDocs test set
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/HanNight/RAMDocs/main/RAMDocs_test.jsonl \
            --output RAMDocs_test.jsonl
          test -s RAMDocs_test.jsonl
          sha256sum RAMDocs_test.jsonl | tee RAMDocs_test.sha256

      - name: Run full model-backed evaluation
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_model_backed_suite.py \
            --ramdocs ../RAMDocs_test.jsonl \
            --frozen-config ../research/results/frozen/frozen_config.json \
            --fallback-summary ../research/results/frozen/ramdocs_summary.csv \
            --output ../research/results/model_backed

      - name: Record provenance
        run: |
          cp RAMDocs_test.sha256 research/results/model_backed/RAMDOCS_SOURCE.sha256
          python - <<'PY'
          import json
          import sentence_transformers
          import torch
          import transformers
          from pathlib import Path

          versions = {
              "sentence_transformers": sentence_transformers.__version__,
              "transformers": transformers.__version__,
              "torch": torch.__version__,
          }
          Path("research/results/model_backed/LIBRARY_VERSIONS.json").write_text(
              json.dumps(versions, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit model-backed results
        run: |
          git config user.name "EvidenceGuard Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main advanced after this evaluation started; refusing to publish stale results."
            exit 0
          fi
          git add -f research/results/model_backed
          if git diff --cached --quiet; then
            echo "No model-backed result changes to commit."
            exit 0
          fi
          git commit -m "research: update model-backed evaluation results"
          git push
