services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the host-relative .env path so persistence uses the mounted volume.
      EVIDENCEGUARD_DATA_PATH: /app/data/documents.json
    volumes:
      - evidenceguard_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  evidenceguard_data:
